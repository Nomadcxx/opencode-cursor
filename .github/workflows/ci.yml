name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - name: Run unit suite
        run: bun run test:ci:unit

      - name: Verify proxy isolation and request credentials
        run: bun run verify:issue-141

      - name: Unit job summary
        if: always()
        run: |
          {
            echo "## Unit Job"
            echo "- Status: \`${{ job.status }}\`"
            echo "- Command: \`bun run test:ci:unit\`"
            echo "- Scope: tools + unit + competitive smoke tests"
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    runs-on: ubuntu-latest
    env:
      CURSOR_ACP_TOOL_LOOP_MODE: opencode
      CURSOR_ACP_ENABLE_OPENCODE_TOOLS: "true"
      CURSOR_ACP_FORWARD_TOOL_CALLS: "false"
      CURSOR_ACP_EMIT_TOOL_UPDATES: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - name: Run integration suite
        run: bun run test:ci:integration

      - name: Integration job summary
        if: always()
        run: |
          {
            echo "## Integration Job"
            echo "- Status: \`${{ job.status }}\`"
            echo "- Command: \`bun run test:ci:integration\`"
            echo "- Loop mode: \`${CURSOR_ACP_TOOL_LOOP_MODE}\`"
            echo "- Forward tool calls: \`${CURSOR_ACP_FORWARD_TOOL_CALLS}\`"
            echo "- Emit tool updates: \`${CURSOR_ACP_EMIT_TOOL_UPDATES}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install
      - name: Verify Node proxy isolation and Windows CLI arguments
        run: bun run verify:issue-141
      - name: Verify SDK stores and cancellation helpers
        run: bun test tests/unit/sdk-store.test.ts tests/unit/sdk-runner.test.ts
